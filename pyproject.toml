[project]
name = "mcp-orchestrator"
version = "0.1.0"
description = "Production-style MCP client in Python: JSON-RPC 2.0, stdio and SSE transports, schema-validated tool registry, Langfuse tracing, FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Singh Rathore" }]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.0"]
demo = ["mcp>=1.2"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mcp>=1.2",
  "langfuse>=3.0",
]

[project.scripts]
mcp-orchestrator = "mcp_orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: talks to the real MCP Python SDK (stdio and HTTP+SSE)"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["mcp_orchestrator"]
branch = true
